name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      qase_mode:
        description: 'Qase reporter mode: off | testops. Leave blank to auto-detect from the QASE_TESTOPS_API_TOKEN secret.'
        required: false
        default: ''

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Playwright tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # Exposes extracted Qase public URL so downstream
    # 'publish-report' can include it in the sticky PR comment
    outputs:
      qase-link: ${{ steps.qase.outputs.link }}

    env:
      BASE_URL: https://www.saucedemo.com
      STANDARD_USER: standard_user
      LOCKED_OUT_USER: locked_out_user
      PROBLEM_USER: problem_user
      PERFORMANCE_GLITCH_USER: performance_glitch_user
      VALID_PASSWORD: secret_sauce
      INVALID_USER: invalid_user
      INVALID_PASSWORD: wrong_password
      HEADLESS: 'true'
      BROWSER: chromium
      REQRES_BASE_URL: https://reqres.in/api
      # Auto-detect Qase mode from the token secret (unset -> off, set -> testops).
      QASE_MODE: ${{ github.event.inputs.qase_mode || (secrets.QASE_TESTOPS_API_TOKEN != '' && 'testops' || 'off') }}
      QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
      QASE_TESTOPS_PROJECT: ${{ vars.QASE_TESTOPS_PROJECT || 'SAUCEPW' }}
      QASE_TESTOPS_RUN_TITLE: "GH Actions - ${{ github.run_number }} - ${{ github.ref_name }}"
      QASE_TESTOPS_RUN_COMPLETE: 'true'
      QASE_TESTOPS_SHOW_PUBLIC_REPORT_LINK: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Reporter log lives in ci-logs/ (NOT test-results/): Playwright's
      # outputDir is test-results/ and it wipes that folder at the start of
      # every run, which would unlink our tee'd log mid-write.
      # Runs the FULL suite (all 39) so the Playwright and Qase reports show
      # the real picture, known bugs included, rather than a filtered
      # all-green subset. The expected @known-bug failures make this exit
      # non-zero, so the step is allowed to fail and the gate below decides
      # whether the build is actually broken.
      - name: Run Playwright tests (full suite)
        id: tests
        continue-on-error: true
        timeout-minutes: 25
        run: |
          mkdir -p ci-logs
          set -o pipefail
          npm test 2>&1 | tee ci-logs/reporter.log

      # Fails the job only if something OUTSIDE @known-bug failed. Expected
      # known-bug failures keep the check green, so they never block a merge.
      - name: Evaluate results (known bugs vs regressions)
        run: npm run ci:gate

      - name: Extract Qase public report link
        id: qase
        if: always()
        run: |
          LINK=$(grep -oE 'https://app\.qase\.io/public/report/[a-zA-Z0-9_-]+' ci-logs/reporter.log | head -1 || true)
          echo "link=$LINK" >> "$GITHUB_OUTPUT"
          if [ -n "$LINK" ]; then
            echo "::notice title=Qase public report::$LINK"
          else
            echo "::warning::No Qase public report link found. Is QASE_MODE=testops and QASE_TESTOPS_SHOW_PUBLIC_REPORT_LINK=true?"
          fi

      - name: Upload reporter log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
          retention-days: 14

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  # Publishes the HTML report to a per-run folder on GitHub Pages and posts
  # the sticky PR comment.
  #
  # PREREQUISITE: Settings -> Pages -> Source: "Deploy from a branch",
  # branch "gh-pages", folder "/ (root)" (one-time).
  #
  # Skipped on fork PRs (GITHUB_TOKEN has no write perms in that context).
  publish-report:
    name: Publish HTML report + post PR comment
    needs: test
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # pushes the report to the gh-pages branch
      pull-requests: write   # posts the sticky comment

    # Serialised across every ref: all runs commit to the same gh-pages
    # branch, so parallel publishes would race and drop reports.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      # Two checkouts: 'src' provides the index generator script, 'gh-pages'
      # is the report store this job appends to.
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      # Assumes the gh-pages branch already exists. If it is ever deleted,
      # recreate it once with an empty orphan commit:
      #   git switch --orphan gh-pages && git commit --allow-empty -m init && git push -u origin gh-pages
      - name: Checkout gh-pages store
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download HTML report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      # Every run publishes to its own folder so the URL in the PR comment is
      # unique and permanent. The previous setup deployed to the Pages site
      # ROOT, which is a fixed URL per repository -- so the link never changed
      # and each run silently overwrote the last run's report.
      - name: Compute per-run report path
        id: paths
        run: |
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            SLOT="pr-${{ github.event.pull_request.number }}"
          else
            SLOT="branch-$(echo '${{ github.ref_name }}' | tr '/' '-')"
          fi
          DIR="reports/$SLOT/run-${{ github.run_number }}"
          # Pages hostnames are lower-case; repo path segment keeps its case.
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          REPO='${{ github.repository }}'
          REPO="${REPO#*/}"
          SHA='${{ github.event.pull_request.head.sha || github.sha }}'
          {
            echo "dir=$DIR"
            echo "url=https://$OWNER.github.io/$REPO/$DIR/"
            echo "sha=${SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      # Copy this run's report in alongside the previous ones, record a little
      # metadata for the index, then regenerate the root index.html so the
      # site root lists every published run instead of returning 404.
      #
      # .nojekyll stops Pages running the report through Jekyll, which would
      # strip any file or folder whose name begins with an underscore.
      - name: Stage report and regenerate index
        run: |
          set -euo pipefail
          DEST="gh-pages/${{ steps.paths.outputs.dir }}"
          mkdir -p "$DEST"
          cp -R playwright-report/. "$DEST/"
          cat > "$DEST/meta.json" <<JSON
          {
            "run": ${{ github.run_number }},
            "sha": "${{ steps.paths.outputs.sha }}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON
          touch gh-pages/.nojekyll
          # --keep caps the store: a full-suite report with failure traces is
          # ~13 MB and Pages serves at most 1 GB, so keep the 5 newest runs
          # per PR/branch and drop older ones.
          node src/scripts/build-report-index.mjs gh-pages --keep 5

      # continue-on-error so the sticky comment below still fires if the push
      # fails. The report and the refreshed index go up in one commit, so the
      # index can never point at a report that is not there.
      - name: Publish to gh-pages
        id: deployment
        continue-on-error: true
        working-directory: gh-pages
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m 'playwright report: ${{ steps.paths.outputs.dir }}'
          git push origin HEAD:gh-pages

      - name: Log deployment URL
        if: always()
        run: |
          if [ '${{ steps.deployment.outcome }}' = 'success' ]; then
            echo "::notice title=Playwright HTML report::${{ steps.paths.outputs.url }}"
          else
            echo "::warning title=Playwright HTML report::gh-pages publish failed. Download the 'playwright-report' artifact instead."
          fi

      # recreate: true deletes the previous comment and posts a new one, so
      # every push produces a genuinely new comment (and a notification)
      # instead of silently editing the existing one in place.
      #
      # To keep ONE comment edited in place instead, drop `recreate`.
      # To accumulate one comment per run, replace `recreate` with a
      # per-run header: `header: test-run-links-${{ github.run_number }}`.
      #
      # if: always() so the comment posts even when the publish step fails.
      - name: Comment PR with report links
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: test-run-links
          recreate: true
          message: |
            ### Test run reports -- run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) @ `${{ steps.paths.outputs.sha }}`

            | Report | Public link |
            |---|---|
            | Playwright HTML | ${{ steps.deployment.outcome == 'success' && steps.paths.outputs.url || format('_publish failed -- [download artifact from run]({0}/{1}/actions/runs/{2})_', github.server_url, github.repository, github.run_id) }} |
            | Qase.io | ${{ needs.test.outputs.qase-link || '_N/A -- Qase disabled or reporter output not captured_' }} |

            <sub>Posted fresh on every push. Both links are unique to this run -- the Playwright report is published to its own folder, so earlier runs stay reachable on the `gh-pages` branch.</sub>
